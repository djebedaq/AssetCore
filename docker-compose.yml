services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assetcore
      POSTGRES_USER: assetcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - assetcore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetcore"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "10000:10000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set a URL-encoded DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ASSETCORE_OWNER_EMAIL: ${ASSETCORE_OWNER_EMAIL:?Set ASSETCORE_OWNER_EMAIL in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@assetcore.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  assetcore_pg:
