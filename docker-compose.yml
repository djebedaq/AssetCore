services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assetcore
      POSTGRES_USER: assetcore
      POSTGRES_PASSWORD: assetcore_dev
    ports:
      - "5432:5432"
    volumes:
      - assetcore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetcore"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "10000:10000"
    environment:
      DATABASE_URL: postgresql+psycopg://assetcore:assetcore_dev@db:5432/assetcore
      SECRET_KEY: local-development-secret-change-it
      ADMIN_EMAIL: admin@assetcore.local
      ADMIN_PASSWORD: AssetCore123!
    depends_on:
      db:
        condition: service_healthy

volumes:
  assetcore_pg:
