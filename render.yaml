services:
  - type: web
    name: assetcore
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assetcore-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@assetcore.local
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: assetcore-db
    plan: free
    databaseName: assetcore
    user: assetcore
