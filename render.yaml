services:
  - type: web
    name: assetcore
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assetcore-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_FIRST_NAME
        value: Евтим
      - key: OWNER_MIDDLE_NAME
        value: Станиславов
      - key: OWNER_LAST_NAME
        value: Горанов
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_JOB_TITLE
        sync: false
      - key: OWNER_INITIAL_PASSWORD
        sync: false
      - key: INSTALLATION_ID
        sync: false
      - key: LICENSE_PUBLIC_KEY
        sync: false
      - key: LICENSE_ENFORCEMENT_ENABLED
        value: true
      - key: DEPLOYMENT_ENVIRONMENT
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SIGNATURE_ENCRYPTION_KEY
        generateValue: true
      - key: PRODUCTION_MODE
        value: true

databases:
  - name: assetcore-db
    plan: free
    databaseName: assetcore
    user: assetcore
