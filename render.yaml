services:
  # STAGING-ONLY blueprint. Production requires a paid pre-deploy migration step.
  - type: web
    name: assetcore
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assetcore-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_FIRST_NAME
        value: Евтим
      - key: OWNER_MIDDLE_NAME
        value: Станиславов
      - key: OWNER_LAST_NAME
        value: Горанов
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_JOB_TITLE
        sync: false
      - key: OWNER_INITIAL_PASSWORD
        sync: false
      - key: INSTALLATION_ID
        sync: false
      - key: LICENSE_PUBLIC_KEY
        sync: false
      - key: LICENSE_ENFORCEMENT_ENABLED
        value: false
      - key: DEPLOYMENT_ENVIRONMENT
        value: staging
      - key: MIGRATION_STRATEGY
        value: startup
      - key: MIGRATION_LOCK_TIMEOUT_SECONDS
        value: 60
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SESSION_MINUTES
        value: 720
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: TRUSTED_PROXY_IPS
        sync: false
      - key: BEARER_COMPATIBILITY_ENABLED
        value: false
      - key: SIGNATURE_ENCRYPTION_KEY
        generateValue: true
      - key: PRODUCTION_MODE
        value: false
      - key: DB_POOL_PRE_PING
        value: true
      - key: DB_POOL_SIZE
        value: 5
      - key: DB_MAX_OVERFLOW
        value: 10
      - key: DB_POOL_TIMEOUT_SECONDS
        value: 30
      - key: DB_POOL_RECYCLE_SECONDS
        value: 1800
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: 10
      - key: DB_STATEMENT_TIMEOUT_MS
        value: 0

databases:
  - name: assetcore-db
    plan: free
    databaseName: assetcore
    user: assetcore
