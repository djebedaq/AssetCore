name: Build check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Frontend dependency security (high/critical/unknown gate)
        run: python3 scripts/audit_dependencies.py frontend --output security-reports/frontend-audit.json
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-security-report
          path: security-reports
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-ci.txt
      - name: Install the official DOCX/PDF converter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-dejavu fonts-liberation
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-ci.txt
      - run: python -m pip check
      - name: Python dependency security (high/critical/unknown gate)
        run: python scripts/audit_dependencies.py python --output security-reports/python-audit.json
      - run: python -m compileall -q backend/app backend/alembic backend/scripts scripts tests
      - run: python -m ruff check backend/app backend/alembic backend/scripts scripts tests
      - run: python backend/scripts/validate_migration_history.py --require-all-protected
      - run: python backend/scripts/validate_authorization_inventory.py
      - run: PYTHONPATH=backend python backend/scripts/catalog_v2_validation.py
      - name: Catalog EN/BG translation gate
        env:
          PYTHONPATH: backend
        run: python backend/scripts/build_catalog_translations.py --check
      - name: Production configuration regression gate
        run: python -m pytest -q --tb=short tests/test_runtime_deployment_hardening.py
      - name: Full backend suite (real PostgreSQL cases run in postgres job)
        run: python -m pytest -q -m "not postgres" --tb=short --durations=10
      - run: python scripts/verify_release.py --output release-verification
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-verification
          path: |
            release-verification
            security-reports
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
      - name: Install the official DOCX/PDF converter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-dejavu fonts-liberation
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-ci.txt
      - name: Export REQUESTS-01 examples from a disposable test database
        env:
          ASSETCORE_REQUESTS01_QA_OUTPUT: ${{ github.workspace }}/.tmp/requests01-examples
        run: python -m pytest -q --tb=short tests/test_requests01.py::test_export_review_examples
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: requests01-examples
          path: .tmp/requests01-examples
          include-hidden-files: true
          if-no-files-found: error
      - name: Export machine layout examples from verified seeds in a disposable database
        env:
          ASSETCORE_MACHINE_LAYOUT_QA_OUTPUT: ${{ github.workspace }}/.tmp/requests01-machine-layout
        run: python -m pytest -q --tb=short tests/test_request_machine_layout.py::test_catalog_preview_approval_and_review_export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: requests01-machine-layout
          path: .tmp/requests01-machine-layout
          include-hidden-files: true
          if-no-files-found: error
      - name: Install pinned browser test runner in disposable directory
        run: |
          npm install --prefix "$RUNNER_TEMP/assetcore-browser" playwright@1.62.1
          npm audit --prefix "$RUNNER_TEMP/assetcore-browser" --audit-level=high
          node "$RUNNER_TEMP/assetcore-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Catalog UX04 real browser acceptance at 390, 768 and 1440 pixels
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/assetcore-browser/node_modules/playwright" python tests/browser/run_catalog_ux04_qa.py
      - name: Catalog UX05 optional publication warnings and runtime requests
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/assetcore-browser/node_modules/playwright" python tests/browser/run_catalog_ux05_qa.py
      - name: Catalog UX06 centralized atomic bindings and responsive removal
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/assetcore-browser/node_modules/playwright" python tests/browser/run_catalog_ux06_qa.py
      - name: REQUESTS-01 free-form approval, preview, delivery and BG/EN/RU responsive forms
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/assetcore-browser/node_modules/playwright" python tests/browser/run_requests01_qa.py
      - name: TRANSFERS-UX-01 and USER-PROFILE-01 signed cycles, two names and responsive modals
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/assetcore-browser/node_modules/playwright" python tests/browser/run_transfers_profile01_qa.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: catalog-ux04-browser
          path: |
            .tmp/catalog03-ux04-browser-*/browser-proof.json
            .tmp/catalog03-ux04-browser-*/*.png
            .tmp/catalog03-ux05-browser-*/browser-proof.json
            .tmp/catalog03-ux05-browser-*/*.png
            .tmp/catalog03-ux06-browser-*/browser-proof.json
            .tmp/catalog03-ux06-browser-*/*.png
            .tmp/catalog03-requests01-browser-*/browser-proof.json
            .tmp/catalog03-requests01-browser-*/*.png
            .tmp/catalog03-transfers-profile01-browser-*/browser-proof.json
            .tmp/catalog03-transfers-profile01-browser-*/protocol-bindings.json
            .tmp/catalog03-transfers-profile01-browser-*/profile-proof.json
            .tmp/catalog03-transfers-profile01-browser-*/*.png
            .tmp/catalog03-transfers-profile01-browser-*/*.pdf
            .tmp/catalog03-transfers-profile01-browser-*/*.docx
            .tmp/catalog03-transfers-profile01-browser-*/*.zip
          include-hidden-files: true
          if-no-files-found: warn

  postgres:
    runs-on: ubuntu-24.04
    # Full signed-workflow coverage needs time for setup and result upload too.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assetcore
          POSTGRES_PASSWORD: assetcore-ci-password
          POSTGRES_DB: assetcore_test_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetcore -d assetcore_test_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ASSETCORE_POSTGRES_SOURCE_URL: postgresql+psycopg://assetcore:assetcore-ci-password@localhost:5432/assetcore_test_source
      ASSETCORE_POSTGRES_RESTORE_URL: postgresql+psycopg://assetcore:assetcore-ci-password@localhost:5432/assetcore_test_restore
      ASSETCORE_POSTGRES_CONCURRENCY_URL: postgresql+psycopg://assetcore:assetcore-ci-password@localhost:5432/assetcore_test_concurrency
      ASSETCORE_REQUIRE_POSTGRES_TESTS: 'true'
      PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump
      PG_RESTORE: /usr/lib/postgresql/16/bin/pg_restore
      PSQL: /usr/lib/postgresql/16/bin/psql
      PGPASSWORD: assetcore-ci-password
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install explicitly versioned PostgreSQL 16 clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16 libreoffice-writer fonts-dejavu fonts-liberation
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Assert PostgreSQL 16 client contract
        run: python scripts/postgres_toolchain.py --clients-only
      - name: Create isolated restore database
        run: psql -h localhost -U assetcore -d assetcore_test_source -v ON_ERROR_STOP=1 -c 'CREATE DATABASE assetcore_test_restore;'
      - name: PostgreSQL migration and encrypted backup/restore round trip
        run: python scripts/postgres_smoke_test.py
      - name: Catalog Builder pre-0025 upgrade and encrypted history restore
        run: |
          psql -h localhost -U assetcore -d assetcore_test_source -v ON_ERROR_STOP=1 -c 'CREATE DATABASE assetcore_test_upgrade_source;'
          psql -h localhost -U assetcore -d assetcore_test_source -v ON_ERROR_STOP=1 -c 'CREATE DATABASE assetcore_test_upgrade_restore;'
          python tests/postgres/catalog_builder_backup_rehearsal.py
      - name: Create isolated concurrency database
        run: psql -h localhost -U assetcore -d assetcore_test_source -v ON_ERROR_STOP=1 -c 'CREATE DATABASE assetcore_test_concurrency;'
      - name: Real PostgreSQL overlapping domain transactions
        run: python -m pytest -q tests/postgres --tb=short --durations=10 --junitxml=postgres-test-results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: postgres-concurrency-results
          path: postgres-test-results.xml
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assetcore
          POSTGRES_PASSWORD: assetcore-ci-password
          POSTGRES_DB: assetcore_test_image_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetcore -d assetcore_test_image_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: compose-validation-password
          DATABASE_URL: postgresql+psycopg://assetcore:compose-validation-password@db:5432/assetcore
          SECRET_KEY: compose-validation-secret-key-which-is-not-used
          OWNER_EMAIL: ci-owner@assetcore.invalid
          OWNER_JOB_TITLE: CI operator
          INSTALLATION_ID: assetcore-ci
          LICENSE_PUBLIC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SIGNATURE_ENCRYPTION_KEY: compose-validation-signature-key
          PUBLIC_BASE_URL: https://assetcore.example.invalid
          FRONTEND_ORIGIN: https://assetcore.example.invalid
        run: docker compose config --quiet
      - name: Validate opt-in development database port override
        env:
          POSTGRES_PASSWORD: compose-validation-password
          DATABASE_URL: postgresql+psycopg://assetcore:compose-validation-password@db:5432/assetcore
          SECRET_KEY: compose-validation-secret-key-which-is-not-used
          OWNER_EMAIL: ci-owner@assetcore.invalid
          OWNER_JOB_TITLE: CI operator
          INSTALLATION_ID: assetcore-ci
          LICENSE_PUBLIC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SIGNATURE_ENCRYPTION_KEY: compose-validation-signature-key
          PUBLIC_BASE_URL: https://assetcore.example.invalid
          FRONTEND_ORIGIN: https://assetcore.example.invalid
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Build production image
        run: docker build --pull --build-arg ASSETCORE_RELEASE_SHA="$GITHUB_SHA" --tag assetcore:ci --tag "assetcore:$GITHUB_SHA" .
      - name: Assert all PostgreSQL client majors in the exact production image
        run: >-
          docker run --rm --read-only --network none
          --tmpfs /tmp:rw,nosuid,noexec,size=512m
          assetcore:ci python scripts/postgres_toolchain.py --clients-only
      - name: Production image PostgreSQL 16 encrypted round trip and real PG17 rejection
        env:
          ASSETCORE_POSTGRES_SOURCE_URL: postgresql+psycopg://assetcore:assetcore-ci-password@localhost:5432/assetcore_test_image_source
          ASSETCORE_POSTGRES_RESTORE_URL: postgresql+psycopg://assetcore:assetcore-ci-password@localhost:5432/assetcore_test_image_restore
          PGPASSWORD: assetcore-ci-password
        run: |
          set -euo pipefail
          mismatch_dir="$(mktemp -d)"
          mismatch_container="assetcore-pg17-clients-$GITHUB_RUN_ID"
          trap 'docker rm --force "$mismatch_container" >/dev/null 2>&1 || true; rm -rf "$mismatch_dir"' EXIT
          # Real PG17 binaries are a read-only QA mount, never part of the release image.
          docker create --name "$mismatch_container" postgres:17-trixie >/dev/null
          docker cp "$mismatch_container:/usr/lib/postgresql/17/bin/." "$mismatch_dir/"
          chmod -R a+rX "$mismatch_dir"
          docker run --rm --read-only --network host --env PGPASSWORD \
            --tmpfs /tmp:rw,nosuid,noexec,size=512m \
            assetcore:ci psql -h localhost -U assetcore -d assetcore_test_image_source \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE assetcore_test_image_restore;'
          docker run --rm --read-only --network host \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,noexec,size=512m \
            --mount "type=bind,source=$mismatch_dir,target=/qa-pg17,readonly" \
            --mount "type=bind,source=$PWD/scripts/postgres_smoke_test.py,target=/app/scripts/postgres_smoke_test.py,readonly" \
            --env ASSETCORE_POSTGRES_SOURCE_URL --env ASSETCORE_POSTGRES_RESTORE_URL \
            --env PG_DUMP=/usr/lib/postgresql/16/bin/pg_dump \
            --env PG_RESTORE=/usr/lib/postgresql/16/bin/pg_restore \
            --env PSQL=/usr/lib/postgresql/16/bin/psql \
            --env ASSETCORE_POSTGRES_MISMATCH_PG_DUMP=/qa-pg17/pg_dump \
            --env ASSETCORE_POSTGRES_MISMATCH_PG_RESTORE=/qa-pg17/pg_restore \
            --env ASSETCORE_REQUIRE_POSTGRES_MISMATCH_TEST=true \
            assetcore:ci python scripts/postgres_smoke_test.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing cryptography dependency for isolated Compose QA
        run: python -m pip install -r backend/requirements.txt
      - name: Portable production Compose init, restart and verified-backup upgrade
        run: python scripts/production_compose_smoke.py --sha "$GITHUB_SHA"
      - name: Verify fixed non-root runtime identity
        run: test "$(docker image inspect assetcore:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Verify production backup operations in the exact image
        run: |
          set -euo pipefail
          docker run --rm --read-only \
            --tmpfs /tmp:rw,nosuid,noexec,size=512m \
            assetcore:ci python scripts/backup_database.py --help
          docker run --rm --read-only \
            --tmpfs /tmp:rw,nosuid,noexec,size=512m \
            assetcore:ci python scripts/verify_backup.py --help
          docker run --rm --read-only \
            --tmpfs /tmp:rw,nosuid,noexec,size=512m \
            assetcore:ci python scripts/restore_database.py --help
      - name: Verify LibreOffice with read-only root filesystem
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,nosuid,noexec,size=512m
          assetcore:ci python backend/scripts/container_runtime_smoke.py
      - name: Verify official visual appendix through LibreOffice
        run: >-
          docker run --rm --read-only --network none
          --tmpfs /tmp:rw,nosuid,noexec,size=512m
          assetcore:ci python backend/scripts/part_visual_appendix_smoke.py
      - name: Verify REQUESTS-01 multi-page DOCX through the application converter
        run: |
          mkdir -p .tmp/requests01-docx
          chmod 777 .tmp/requests01-docx
          docker run --rm --read-only --network none \
            --tmpfs /tmp:rw,nosuid,noexec,size=512m \
            --mount "type=bind,source=$PWD/.tmp/requests01-docx,target=/qa-output" \
            assetcore:ci python backend/scripts/requests01_document_smoke.py --output /qa-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: requests01-docx-layout
          path: .tmp/requests01-docx
          include-hidden-files: true
          if-no-files-found: warn
      # Builder uses the same official renderer; verify its actual graph too.
      - name: Verify offline OCR of an explicitly selected synthetic parts list
        run: >-
          docker run --rm --read-only --network none
          --tmpfs /tmp:rw,nosuid,noexec,size=512m
          assetcore:ci python backend/scripts/catalog_spare_parts_ocr_smoke.py
      - name: Verify adaptive cell OCR, masks, rotation, skew and partial rows
        run: >-
          docker run --rm --init --read-only --network none
          --memory 1g --cpus 2 --pids-limit 64
          --tmpfs /tmp:rw,nosuid,noexec,size=192m
          assetcore:ci python backend/scripts/catalog_adaptive_ocr_smoke.py
      - name: Verify late-bound Builder official documents through LibreOffice
        run: |
          docker run --rm --read-only --network none \
            --tmpfs /tmp:rw,nosuid,noexec,size=512m \
            assetcore:ci python backend/scripts/catalog_builder_document_smoke.py
      - name: Run liveness and readiness smoke in the production image
        shell: bash
        run: |
          set -euo pipefail
          runtime_secret="$(openssl rand -base64 48)"
          runtime_signature_key="$(openssl rand -base64 48)"
          runtime_owner_password="$(openssl rand -base64 36)"
          docker run --detach --name assetcore-runtime-smoke \
            --read-only --tmpfs /tmp:rw,nosuid,noexec,size=512m \
            --publish 18080:10000 \
            --env DATABASE_URL=sqlite:////tmp/assetcore-runtime.db \
            --env SECRET_KEY="$runtime_secret" \
            --env OWNER_EMAIL=runtime-owner@assetcore.invalid \
            --env OWNER_JOB_TITLE='Container QA operator' \
            --env OWNER_INITIAL_PASSWORD="$runtime_owner_password" \
            --env SIGNATURE_ENCRYPTION_KEY="$runtime_signature_key" \
            --env DEPLOYMENT_ENVIRONMENT=test \
            --env PRODUCTION_MODE=false \
            --env LICENSE_ENFORCEMENT_ENABLED=false \
            --env MIGRATION_STRATEGY=startup \
            assetcore:ci
          trap 'docker logs assetcore-runtime-smoke || true; docker rm --force assetcore-runtime-smoke || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/api/ready > /tmp/readiness.json; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/api/health
          curl --fail --silent http://127.0.0.1:18080/api/ready
